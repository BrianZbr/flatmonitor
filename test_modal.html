<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modal Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .log-link { 
            background: #0969da; 
            color: white; 
            padding: 8px 12px; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
        }
        .log-modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
        }
        .log-modal-content {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            max-width: 90%;
            max-height: 90%;
            width: 800px;
            height: 600px;
            display: flex;
            flex-direction: column;
        }
        .log-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            border-bottom: 1px solid #30363d;
        }
        .log-modal-close {
            background: none;
            border: none;
            color: #8b949e;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0.25rem;
            line-height: 1;
        }
        .log-modal-body {
            padding: 1rem;
            overflow-y: auto;
            flex: 1;
        }
    </style>
</head>
<body>
    <h1>Modal Test</h1>
    <button class="log-link" 
            data-domain-id="test" 
            data-log-path="test.log" 
            data-domain-url="example.com" 
            data-archive-links="[]">
        logs
    </button>

    <div id="logModal" class="log-modal">
        <div class="log-modal-content">
            <div class="log-modal-header">
                <h3 id="logModalTitle">Recent Log Entries</h3>
                <button class="log-modal-close" onclick="closeLogModal()">&times;</button>
            </div>
            <div class="log-modal-body">
                <p>Modal content here</p>
            </div>
        </div>
    </div>

    <script>
        // Add event listener for log link buttons
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM loaded');
            document.querySelectorAll('.log-link').forEach(button => {
                console.log('Found log link button');
                button.addEventListener('click', function() {
                    console.log('Button clicked');
                    const domainId = this.dataset.domainId;
                    const logPath = this.dataset.logPath;
                    const domainUrl = this.dataset.domainUrl;
                    const archiveLinks = JSON.parse(this.dataset.archiveLinks || '[]');
                    openLogModal(domainId, logPath, domainUrl, archiveLinks);
                });
            });
        });

        function openLogModal(domainId, logPath, domainUrl, archiveLinks) {
            console.log('openLogModal called with:', { domainId, logPath, domainUrl, archiveLinks });
            const modal = document.getElementById('logModal');
            const title = document.getElementById('logModalTitle');
            
            title.textContent = 'Recent Log Entries - ' + domainUrl;
            modal.style.display = 'flex';
            console.log('Modal display set to flex');
        }

        function closeLogModal() {
            const modal = document.getElementById('logModal');
            modal.style.display = 'none';
        }

        // Close modal when clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('logModal');
            if (event.target === modal) {
                closeLogModal();
            }
        }
    </script>
</body>
</html>
